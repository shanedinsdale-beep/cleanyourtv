plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.hdmihome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.hdmihome'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded from a USB stick, never published: the debug key is enough.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
